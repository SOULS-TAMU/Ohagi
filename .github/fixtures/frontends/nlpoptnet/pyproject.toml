[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlpoptnet"
version = "0.1.0"
description = "NLPOptNet frontend on shared OHAGI components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ohagi[flax,optax,plotting,export]>=0.1.0,<0.2", "purin>=0.1.0,<0.2"]

license = "Apache-2.0"
license-files = ["LICENSE*", "NOTICE"]
authors = [{name = "SOULS-TAMU contributors"}]
keywords = ["jax", "constrained-learning", "differentiable-optimization"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "ruff", "osqp", "absl-py", "flatbuffers"]
plotting = ["matplotlib>=3.8"]
export = ["absl-py", "flatbuffers"]
cuda12 = ["jax[cuda12]>=0.4.30"]

[tool.setuptools.packages.find]
where = ["src"]




[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"
