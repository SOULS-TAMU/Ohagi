name: Installed package check
description: Install exact stack wheels and run the caller's unchanged smoke test
inputs:
  version:
    description: Exact candidate or published version
    required: true
  index:
    description: pypi or testpypi
    default: pypi
  local-directory:
    description: Optional directory containing candidate wheels
    default: ''
  smoke-distribution:
    description: Optional distribution alias used on TestPyPI
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
        PACKAGE_INDEX: ${{ inputs.index }}
        LOCAL_DIRECTORY: ${{ inputs.local-directory }}
        SMOKE_DISTRIBUTION: ${{ inputs.smoke-distribution }}
      run: |
        python -m pip install --upgrade pip
        install=(--version "$PACKAGE_VERSION")
        smoke=(--version "$PACKAGE_VERSION")
        case "$PACKAGE_INDEX" in
          testpypi) install+=(--testpypi) ;;
          pypi) ;;
          *) echo 'Unknown package index' >&2; exit 1 ;;
        esac
        if [[ -n "$LOCAL_DIRECTORY" ]]; then install+=(--local-dir "$LOCAL_DIRECTORY"); fi
        if [[ -n "$SMOKE_DISTRIBUTION" ]]; then smoke+=(--distribution "$SMOKE_DISTRIBUTION"); fi
        python .github/scripts/package_install.py "${install[@]}"
        python .github/scripts/package_smoke.py "${smoke[@]}"
